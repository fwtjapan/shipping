<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>離線中 - 雲端集運</title>
  <meta name="theme-color" content="#16213e">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .box {
      max-width: 360px; width: 100%;
      text-align: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 36px 28px;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { margin: 0 0 12px; font-size: 22px; color: #f39c12; }
    p { color: #aaa; line-height: 1.6; font-size: 14px; margin: 0 0 24px; }
    button {
      background: linear-gradient(135deg, #f39c12, #e67e22);
      color: #fff; border: none;
      padding: 12px 28px; border-radius: 10px;
      font-size: 15px; font-weight: 700;
      cursor: pointer;
    }
    button:active { transform: scale(0.98); }
    .tip {
      margin-top: 24px; font-size: 12px; color: #666;
      padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>目前沒有網路</h1>
    <p>
      請確認你的網路連線狀況，<br>
      然後再試一次。
    </p>
    <button onclick="location.reload()">🔄 重新整理</button>
    <div class="tip">
      FWT JAPAN 雲端集運
    </div>
  </div>
  <script>
    // 網路恢復時自動重新整理
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
